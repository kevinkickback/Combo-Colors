name: CI

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, and test
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  squash-merge:
    name: Squash merge dev into main
    needs: check
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Wait for optional Copilot review
        continue-on-error: true
        timeout-minutes: 11
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const expectedHead = context.payload.pull_request.head.sha;
            const copilotLogins = new Set([
              'copilot',
              'copilot-pull-request-reviewer',
              'copilot-pull-request-reviewer[bot]',
            ]);
            const isCopilot = (user) => {
              const login = (user?.login ?? '').toLowerCase();
              return copilotLogins.has(login) || (user?.type === 'Bot' && login.includes('copilot'));
            };
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            const startedAt = Date.now();
            const activityGraceDeadline = startedAt + 60_000;
            const hardDeadline = startedAt + 600_000;
            let activeReviewSeen = false;

            while (Date.now() < hardDeadline) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number, per_page: 100,
              });
              const reviewedHead = reviews.some((review) =>
                review.commit_id === expectedHead && isCopilot(review.user),
              );
              if (reviewedHead) {
                core.info(`Copilot reviewed ${expectedHead}; continuing to repository merge checks.`);
                return;
              }

              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner, repo, issue_number: pull_number, per_page: 100,
              });
              const copilotActivityTimes = timeline.flatMap((event) => {
                const requestedCopilot =
                  event.event === 'review_requested' && isCopilot(event.requested_reviewer);
                const copilotStarted =
                  event.event === 'copilot_work_started' &&
                  event.performed_via_github_app?.slug === 'copilot-pull-request-reviewer';
                const timestamp = Date.parse(event.created_at ?? '');
                return (requestedCopilot || copilotStarted) && Number.isFinite(timestamp)
                  ? [timestamp]
                  : [];
              });
              const copilotCompletionTimes = reviews.flatMap((review) => {
                const timestamp = Date.parse(review.submitted_at ?? '');
                return isCopilot(review.user) && Number.isFinite(timestamp) ? [timestamp] : [];
              });
              const latestActivity = Math.max(0, ...copilotActivityTimes);
              const latestCompletion = Math.max(0, ...copilotCompletionTimes);
              const reviewIsActive = latestActivity > latestCompletion;

              if (reviewIsActive && !activeReviewSeen) {
                activeReviewSeen = true;
                core.info('Copilot review activity detected; waiting for its review of the checked revision.');
              }

              if (!activeReviewSeen && Date.now() >= activityGraceDeadline) {
                core.notice('No active Copilot review was detected within one minute; continuing without it.');
                return;
              }

              const remaining = hardDeadline - Date.now();
              if (remaining <= 0) break;
              await sleep(Math.min(10_000, remaining));
            }

            core.notice('An active Copilot review did not finish within ten minutes; continuing without it.');

      - name: Merge the checked PR revision
        id: merge
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const expected = context.payload.pull_request;
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: expected.number,
            });
            if (pr.head.sha !== expected.head.sha) {
              throw new Error('The PR changed; its latest revision must pass checks before merging.');
            }
            if (pr.merged) {
              core.setOutput('sha', pr.merge_commit_sha);
              return;
            }
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                pr.head.ref !== 'dev' || pr.head.repo.full_name !== `${owner}/${repo}`) {
              throw new Error('The PR is no longer eligible for automatic merging.');
            }
            const { data: base } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main',
            });
            if (base.commit.sha !== expected.base.sha) {
              throw new Error('main changed during checks; update the PR before retrying.');
            }
            const { data: result } = await github.rest.pulls.merge({
              owner, repo, pull_number: pr.number,
              merge_method: 'squash', sha: expected.head.sha,
            });
            if (!result.merged) throw new Error(result.message);
            core.setOutput('sha', result.sha);

  release:
    name: Release merged version
    needs: squash-merge
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release.yml
    with:
      source-sha: ${{ needs.squash-merge.outputs.sha }}
